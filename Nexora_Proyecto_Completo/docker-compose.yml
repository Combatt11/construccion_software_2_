services:
  mysql-db:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexora_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:6.0
    container_name: nexora-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  nexora-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-app
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/nexora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root_password
      MONGODB_URI: mongodb://mongo-db:27017/nexora_audit_db
      JWT_SECRET: TDEATDEATDEATDEATDEATDEATDEATDEA
      SERVER_PORT: 8080
    depends_on:
      mysql-db:
        condition: service_healthy
      mongo-db:
        condition: service_started

volumes:
  mysql_data:
  mongo_data:
