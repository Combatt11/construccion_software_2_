services:
  mysql-db:
    image: mysql:8.0
    container_name: nexora-mysql
    restart: always
    environment:
      MYSQL_DATABASE: nexora_db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:6.0
    container_name: nexora-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
