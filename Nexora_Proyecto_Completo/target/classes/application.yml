server:
  port: 8080

spring:
  application:
    name: nexora
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/nexora_audit_db}

# JWT (placeholders; se configurarán en fases posteriores)
jwt:
  secret: ${JWT_SECRET:TDEATDEATDEATDEATDEATDEATDEATDEA}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
